plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'io.github.gradle-nexus.publish-plugin' version '1.3.0'
}

version = '5.5.5-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
    withJavadocJar()
    withSourcesJar()
}

def antTargets = ['build', 'test', 'clean', 'javadoc', 'jar']
ant.importBuild('build.xml') { String oldTargetName ->
     if (antTargets.contains(oldTargetName)) {
         return 'ant_' + oldTargetName
     } else {
         return oldTargetName
     }
}

sourceSets {
    main {
        java {
            srcDir 'src/java'
        }
        resources {
            srcDir 'src/compiled-dictionaries/ipadic'
            srcDir 'src/resources'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'lib', include: '**/*.jar')
}

javadoc {
    failOnError = false
    options {
        jFlags('-Duser.language=en')
        addStringOption('locale', 'en_US')
        addStringOption('bottom', '<span>Copyright 2000-2023, OmegaT project and contributors</span>')
        addStringOption('encoding', 'UTF-8')
        addBooleanOption("Xdoclint:none", true)
        addBooleanOption('frames', false)
        addBooleanOption('public', true)
    }
}

tasks.withType(JavaCompile) {
   options.encoding = "UTF-8"
}

publishing {
    publications {
        mavenJava(MavenPublication) { publication ->
            groupId = 'org.omegat.lucene'
            artifactId = 'lucene-gosen-ipadic'
            from components.java

            pom {
                name = 'Lucene-Gosen'
                description = 'Lucene-Gosen'
                url = 'https://omegat.org'
                scm {
                    connection = "scm:git:https://github.com/omegat-org/lucene-gosen"
                    developerConnection = "scm:git:https://github.com/omegat-org/lucene-gosen"
                    url = "https://github.com/omegat-org/lucene-gosen"
                }
                licenses {
                    license {
                        name = 'The GNU Lesser General Public License, Version 2.1'
                        url = 'https://www.gnu.org/licenses/old-licenses/lgpl-2.1.html'
                    }
                }
                developers {
                    developer {
                        id = 'omegat'
                        name = 'OmegaT Developers'
                        email = 'info@omegat.org'
                    }
                }
            }
        }
    }
}

nexusPublishing {
    repositories {
        sonatype {
            nexusUrl.set(uri("https://s01.oss.sonatype.org/service/local/"))
            snapshotRepositoryUrl.set(uri("https://s01.oss.sonatype.org/content/repositories/snapshots/"))
            username = findProperty('ossrhUsername')
            password = findProperty('ossrhPassword')
        }
    }
}

signing {
    sign publishing.publications.mavenJava
    if (!findProperty("signing.keyId")) {
        useGpgCmd()
    }
}

